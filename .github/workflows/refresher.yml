name: refresher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresher
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
        run: python ./scripts/refresh/refresh.py
