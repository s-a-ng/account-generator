name: firefox

on:
  workflow_dispatch:
    inputs:
      ingest_division:
        description: Roblox session division
        required: true
        default: default
      ingest_pool:
        description: Roblox session pool
        required: true
        default: global

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          
      - name: Run generator
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ROBLOX_SESSION_INGEST_DIVISION: ${{ inputs.ingest_division }}
          ROBLOX_SESSION_INGEST_POOL: ${{ inputs.ingest_pool }}
          GENERATOR_ARTIFACT_DIR: artifacts/generator
          PYTHONUNBUFFERED: "1"
        run: |
          echo $UID > /proc/self/loginuid
          DISPLAY=:99 python -u ./scripts/generate/firefox.py

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-diagnostics
          path: artifacts/generator
          if-no-files-found: ignore
