name: account generator

on:
  workflow_dispatch:
    inputs:
      ingest_division:
        required: true
        default: default
      ingest_pool:
        required: true
        default: global
      max_successes:
        required: true
        default: "0"
      use_selenium_proxy:
        required: true
        type: boolean
        default: false
      browser_engine:
        required: true
        type: choice
        default: undetected_geckodriver
        options:
          - undetected_geckodriver
          - seleniumbase_uc
      browser_session_refresh_diagnostic:
        required: true
        type: boolean
        default: false
      diagnostic_username:
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install undetected geckodriver dependencies
        if: inputs.browser_engine == 'undetected_geckodriver'
        run: |
          pip install -r requirements.txt

      - name: Install SeleniumBase UC dependencies
        if: inputs.browser_engine == 'seleniumbase_uc'
        run: |
          pip install -r requirements-seleniumbase.txt

      - name: Set up virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          
      - name: Run generator
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ROBLOX_SESSION_INGEST_DIVISION: ${{ inputs.ingest_division }}
          ROBLOX_SESSION_INGEST_POOL: ${{ inputs.ingest_pool }}
          GENERATOR_ARTIFACT_DIR: artifacts/generator
          GENERATOR_RETRY_ATTEMPTS: "5"
          GENERATOR_MAX_SUCCESSES: ${{ inputs.max_successes }}
          SELENIUM_PROXY_ENABLED: ${{ inputs.use_selenium_proxy }}
          BROWSER_ENGINE: ${{ inputs.browser_engine }}
          BROWSER_SESSION_REFRESH_DIAGNOSTIC: ${{ inputs.browser_session_refresh_diagnostic }}
          SESSION_REFRESH_DIAGNOSTIC_USERNAME: ${{ inputs.diagnostic_username }}
          AGE_VERIFICATION_ENABLED: "false"
          PYTHONUNBUFFERED: "1"
        run: |
          echo $UID > /proc/self/loginuid
          DISPLAY=:99 python -u ./scripts/generate/firefox.py

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-diagnostics
          path: artifacts/generator
          if-no-files-found: ignore
